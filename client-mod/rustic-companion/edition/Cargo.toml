[package]
name = "rustic-edition"
description = "The Rustic edition client: Horizon's official game with the Rustic companion linked in (built and signed by Rustic's CI, ADR 0070)"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false
build = "build.rs"

[[bin]]
name = "rustic-client"
path = "src/main.rs"

[dependencies]
rusticmc-companion = { path = "../mod" }
horizon-client = { path = "../../../../server/horizon/crates/horizon-client" }
# The game's allocator and the mod API level mark (as horizon-official's executable).
horizon-game = { path = "../../../../server/horizon/crates/horizon-game" }
# Of Horizon's in-game parts, only Play with Friends joins (ADR 0006): not its always-on
# heartbeat ping, its official server entry or its Discord status.
horizon-friends = { path = "../../../../server/horizon/crates/horizon-friends", features = ["game"] }
horizon-hooks = { path = "../../../../server/horizon/crates/horizon-hooks" }

# The title bar's colours and text on Windows (edition/src/chrome.rs): the Win32 bindings already
# in Horizon's Cargo.lock (MIT OR Apache-2.0, Microsoft).
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
] }

# Rustic's icon in the Windows executable (build.rs), as Horizon's own executables embed theirs.
[build-dependencies]
winresource = "0.1"

[lints]
workspace = true
