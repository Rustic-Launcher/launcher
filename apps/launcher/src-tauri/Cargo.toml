[package]
name = "rustic-launcher"
description = "Rustic Launcher desktop app (Tauri v2): the Rust side of the UI"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[lib]
name = "rustic_launcher_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
async-trait = "0.1"
chrono = { version = "0.4.41", default-features = false, features = ["std"] }
rusticmc-api-client = { path = "../../../crates/rusticmc-api-client", default-features = false }
rusticmc-auth = { path = "../../../crates/rusticmc-auth" }
rusticmc-content = { path = "../../../crates/rusticmc-content" }
rusticmc-hosting = { path = "../../../crates/rusticmc-hosting" }
rusticmc-instances = { path = "../../../crates/rusticmc-instances" }
rusticmc-launcher-core = { path = "../../../crates/rusticmc-launcher-core" }
rusticmc-servers = { path = "../../../crates/rusticmc-servers" }
rusticmc-tunnel = { path = "../../../crates/rusticmc-tunnel" }
percent-encoding = "2.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = { version = "0.37", default-features = false, features = ["system"] }
tauri = { version = "2.12", features = [] }
tauri-plugin-deep-link = "2.6"
tauri-plugin-dialog = "2"
tauri-plugin-log = "2.10"
tauri-plugin-notification = "2.8"
tauri-plugin-opener = "2.7"
tauri-plugin-single-instance = { version = "2.5", features = ["deep-link"] }
tauri-plugin-updater = "2.14"
tauri-plugin-window-state = "2.5"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "io-util", "fs"] }
toml = "0.9"
tracing = "0.1"
uuid = { version = "1", features = ["v4"] }

[features]
# `tauri build` turns this on: the frontend is embedded from frontendDist instead of devUrl.
custom-protocol = ["tauri/custom-protocol"]

[lints]
workspace = true
