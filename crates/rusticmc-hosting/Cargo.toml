[package]
name = "rusticmc-hosting"
description = "Rustic Launcher hosting: one HostingProvider abstraction over local servers, the user's own VPS (SSH/SFTP) and Rustic Cloud (coming soon)"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
async-trait = "0.1"
futures = { version = "0.3", default-features = false, features = ["std"] }
hex = "0.4"
if-addrs = "0.15"
# Ed25519 key generation for VPS profiles (the RNG ssh-key 0.7 takes).
rand = "0.10"
# Pure-Rust SSH (ADR 0120): the `ring` backend, like rustls in this workspace (no aws-lc / cmake / nasm).
russh = { version = "0.65", default-features = false, features = ["ring", "rsa", "flate2"] }
russh-sftp = "3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
# Prepared game files go up as one .tar (thousands of small SFTP writes would take minutes).
tar = { version = "0.4", default-features = false }
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "io-util", "sync", "time", "net"] }
toml = "0.9"
tracing = "0.1"
zip = { version = "2", default-features = false, features = ["deflate"] }

# The OS keychain (ADR 0123): Windows Credential Manager, macOS Keychain, Secret Service on Linux.
[target.'cfg(windows)'.dependencies]
keyring = { version = "3.6", features = ["windows-native"] }
[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3.6", features = ["apple-native"] }
[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3.6", features = ["linux-native-async-persistent", "tokio", "crypto-rust"] }

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "test-util"] }

[lints]
workspace = true
