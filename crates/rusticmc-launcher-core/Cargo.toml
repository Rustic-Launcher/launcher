[package]
name = "rusticmc-launcher-core"
description = "Rustic Launcher core: paths, versioned config, errors, tracing, download manager"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
directories = "6"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
hex = "0.4"
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "http2", "json", "stream", "form", "query", "charset", "system-proxy"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "io-util", "sync", "time"] }
tokio-util = "0.7"
toml = "0.9"
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "tracing-log"] }

[dev-dependencies]
tempfile = "3"
wiremock = "0.6"

[lints]
workspace = true
