[package]
name = "rusticmc-content"
description = "Rustic Launcher content: Modrinth, Horizon registry and Rustic registry sources, Horizon compatibility verdicts, installs into instances, servers and worlds, .mrpack import, Rustic packs, Rustic Server plugins, fair-play filter"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
# The shared HTTP client (reqwest over rustls/ring) and the download manager (desktop owner).
rusticmc-launcher-core = { path = "../rusticmc-launcher-core" }
async-trait = "0.1"
hex = "0.4"
minisign-verify = "0.3"
semver = { version = "1", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["time", "sync"] }
toml = "0.9"
tracing = "0.1"
zip = { version = "4", default-features = false, features = ["deflate"] }

[dev-dependencies]
# The API's own wire types (no HTTP client): the Rustic source is tested against their JSON.
rusticmc-api-client = { path = "../rusticmc-api-client", default-features = false }
chrono = { version = "0.4.41", default-features = false, features = ["serde", "clock", "std"] }
uuid = { version = "1", features = ["serde", "v4"] }
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
wiremock = "0.6"

[lints]
workspace = true
