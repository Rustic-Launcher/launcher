<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 800" width="1280" height="800" role="img" aria-label="13-first-launch wireframe">
<title>13-first-launch</title>
<rect width="1280" height="800" fill="#1b1b1b"/>
<rect x="390" y="120" width="500" height="560" rx="16" fill="#232323" stroke="#4a4a4a"/>
<text x="640" y="180" font-family="Inter, Segoe UI, sans-serif" font-size="26" font-weight="700" fill="#e6e6e6" text-anchor="middle">Welcome to Rustic</text>
<text x="640" y="208" font-family="Inter, Segoe UI, sans-serif" font-size="13" font-weight="500" fill="#9a9a9a" text-anchor="middle">Step 1 of 4 · Sign in with Microsoft</text>
<rect x="450" y="250" width="380" height="48" rx="12" fill="#bdbdbd" stroke="#4a4a4a"/>
<text x="640.0" y="279.0" font-family="Inter, Segoe UI, sans-serif" font-size="13" font-weight="600" fill="#111" text-anchor="middle">Sign in with Microsoft (browser)</text>
<rect x="450" y="310" width="380" height="40" rx="12" fill="#2e2e2e" stroke="#4a4a4a"/>
<text x="640.0" y="335.0" font-family="Inter, Segoe UI, sans-serif" font-size="13" font-weight="600" fill="#e6e6e6" text-anchor="middle">Use a code on another device</text>
<rect x="450" y="370" width="380" height="90" rx="12" fill="#2e2e2e" stroke="#4a4a4a"/>
<text x="462" y="392" font-family="Inter, Segoe UI, sans-serif" font-size="13" font-weight="600" fill="#e6e6e6" text-anchor="start">Why?</text>
<text x="462" y="410" font-family="Inter, Segoe UI, sans-serif" font-size="11" font-weight="400" fill="#9a9a9a" text-anchor="start">You need to own Minecraft: Java Edition. Your password never touches Rustic.</text>
<text x="640" y="500" font-family="Inter, Segoe UI, sans-serif" font-size="11" font-weight="500" fill="#9a9a9a" text-anchor="middle">Next: Rustic account (optional) · Privacy choices · Get the game ready</text>
<circle cx="604" cy="640" r="5" fill="#bdbdbd"/>
<circle cx="628" cy="640" r="5" fill="#4a4a4a"/>
<circle cx="652" cy="640" r="5" fill="#4a4a4a"/>
<circle cx="676" cy="640" r="5" fill="#4a4a4a"/>
<text x="16" y="794" font-family="Inter, Segoe UI, sans-serif" font-size="10" font-weight="400" fill="#9a9a9a" text-anchor="start">First launch: 4 steps (Microsoft sign-in, Rustic account or skip, privacy toggles all off, game preparation).</text>
</svg>
